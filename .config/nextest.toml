[profile.ci]
status-level = "fail"
final-status-level = "fail"
failure-output = "final"
success-output = "never"
fail-fast = false

[profile.ci.junit]
path = "junit.xml"

[profile.local]
status-level = "fail"
final-status-level = "fail"
failure-output = "immediate-final"
success-output = "never"
fail-fast = true
