[package]
name = "ripwire-rs"
version = "0.6.5"
edition = "2024"
authors = ["Cason Adams", "David Brewster (ripwire, https://github.com/redhat-et/ripwire)"]
description = "High-throughput agent context router and deterministic static analysis engine"
readme = "README.md"
license = "Apache-2.0"
homepage = "https://casonadams.github.io/ripwire-rs/"
repository = "https://github.com/casonadams/ripwire-rs"
documentation = "https://docs.rs/ripwire-rs"
keywords = ["static-analysis", "code-intelligence", "call-graph", "mcp", "coding-agents"]
categories = ["development-tools", "command-line-utilities"]
default-run = "ripwire-rs"
include = [
    "src/**/*",
    "vendor/grammars/**/*.c",
    "vendor/grammars/**/*.h",
    "man/**/*",
    "skills/**/*",
    "NOTICE",
    "build.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[lib]
name = "ripwire_rs"
path = "src/lib.rs"

[[bin]]
name = "ripwire-rs"
path = "src/main.rs"

[[bin]]
name = "rw"
path = "src/bin/rw.rs"
[[bench]]
name = "bench_pipeline"
harness = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
gix = { version = "0.89", default-features = false, features = ["revision", "blob-diff", "parallel", "sha1", "status"] }
lasso = { version = "0.7", features = ["multi-threaded", "serialize"] }
memchr = "2.8"
rayon = "1.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-cuda = "0.21"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23.2"
tree-sitter-zig = "1.1"
tree-sitter-solidity = "1.2"
tree-sitter-hcl = "1.1"
tree-sitter-scala = "0.25.1"
tree-sitter-erlang = "0.21.0"
tree-sitter-objc = "3.0.2"
tree-sitter-fortran = "0.6.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-lua = "0.5.0"
tree-sitter-graphql = "0.3.0"
tree-sitter-proto = "0.6.0"
tree-sitter-elixir = "0.3.5"
scip = "0.10.0"
protobuf = "=3.7.2"
roxmltree = { version = "0.21.1", default-features = false, features = ["std", "positions"] }

[build-dependencies]
cc = "1.7.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
