# Deliberate divergences from upstream ripwire, read by scripts/validate-parity.py with tomllib.
#
# Measured against upstream ripwire 0.6.9 (built_from=bedc0cdcf), except entries whose evidence names
# "upstream 0.6.8 (built_from=cd11226a6)": the installed upstream was 0.6.8 when those were re-measured. Every evidence= line
# names the release it was taken with. When the installed upstream differs (`ripwire --version`), expect entries to fail for reasons
# that are not regressions: re-measure the failing entries, then update this line in the same commit.
#
# Paged row lists follow one generic rule in the checker and need no entry: same schema, totals
# equal upstream's, every shown row in upstream's full (--limit) set, rows in our ranking order,
# and bytes within upstream's or richer by density. An entry records only what that rule cannot.
# Kinds, checked against measured output:
#   smaller                 our stdout bytes <= upstream stdout bytes; may declare omits (see docs/GATES.md) and extra root attributes
#   richer                  our facts (elements + attributes) > upstream's, and our facts-per-byte >= upstream's
#   fixes-upstream-defect   evidence = tests/<mod>/<file>.rs::test_name, which must exist
#   defect                  our known defect; printed as a warning and counted in defect_budget
# defect_budget must equal the number of defect entries: a new defect fails, a fixed one must lower it.
# An entry with a [divergence.files] table runs against that fixture (written to a temp dir) instead of the tree.

defect_budget = 6

