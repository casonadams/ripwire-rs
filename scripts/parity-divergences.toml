id = "grep-merges-hits-in-one-symbol"
command = "--grep=row_bytes"
case = ""
kind = "smaller"
why = "Hits in the same enclosing symbol collapse into one <hit n=K> row, so the first page carries fewer rows than upstream's one-row-per-line list; the merged row's key is not a row of the unmerged full set, which the paged-row rule cannot express."
evidence = "measured: default page 85 hit rows; --limit=100000 lists 90 (the n=\"2\" rows split back into single-line hits)."

