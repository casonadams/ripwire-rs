# Resolver gauges on this repository, read by scripts/check-resolution.py (make resolution).
# Ceilings sit about 2% above the measured value. Raise one only with a reason in the commit;
# lower one in the commit that improves resolution so the gain cannot be lost.
# Measured with tests/resolve/declared_receiver_owner.rs in the tree: graph_ambiguous=572, graph_unresolved=950.
# The unresolved count rose from 865 at 15de2fe: about 80 calls named kind or walk (tree-sitter Node methods in
# newly added parser code, which no in-tree definition answers) and 7 typed Graph receivers. Graph is declared
# twice on this tree (src/graph/mod.rs and a type alias in tests/git/history.rs), so the owner is not unique from
# the calling file and those calls decline by design.
# The gauge later read 1001 after the corpus harness added Python scripts (lsp2scip and the corpus runner) whose
# standard-library calls the resolver cannot bind; the ceiling is 2% above that reading. It read 1055 after the
# corpus verification tooling (scripts/corpus/verify.py, about 55 such calls) and the ceiling follows it.
# Merged tree (integ/r10), before the std-member change: graph_ambiguous=588, graph_unresolved=1102. The Go
# typed-receiver module (src/languages/go/types.rs) added 3 ambiguous and 24 unresolved; the Kotlin receiver-chain
# and helper commits 1 and 29; the nested-type qualification 2 and 1 more ambiguous. Those calls are tree-sitter
# Node methods on receivers the resolver cannot type. Their names (child_by_field_name, named_child, utf8_text,
# kind, ...) have no in-tree definition, so the Rust std-member list classifies them as builtin: unresolved 660.

[[ceiling]]
gauge = "graph_ambiguous"
max = 600

[[ceiling]]
gauge = "graph_unresolved"
max = 673

# SCIP oracle (rust-analyzer), measured on this repository: precision=0.9868, recall=0.9789.
# Floors sit just under the measurement; raise one in the commit that improves it.

[[floor]]
metric = "precision"
min = 0.9855

[[floor]]
metric = "recall"
min = 0.976
