# Byte ceilings for default answers on this repository, checked by scripts/check-output-size.py.
# A ceiling sits about 10% above the measured size so ordinary growth passes; a verb that
# outgrows its ceiling must be budgeted down, or the ceiling raised in a commit that says why.
# Multi-list answers (several lists in one bundle, budgeted per list): --report, --deps, --pack-task, --impact, --communities, --quality-panel.

[[budget]]
command = ""
max_bytes = 9600

[[budget]]
command = "--for=fit_rows"
max_bytes = 1408

[[budget]]
command = "--for='how are pages windowed under a byte budget'"
max_bytes = 12288

[[budget]]
command = "--callers=fit_rows"
max_bytes = 1152

[[budget]]
command = "--callees=window_fit"
max_bytes = 1536

[[budget]]
command = "--uses=row_bytes"
max_bytes = 5120

[[budget]]
command = "--defs=run"
max_bytes = 2816

[[budget]]
command = "--impact=fit_rows"
max_bytes = 16128

[[budget]]
command = "--impact=row_bytes"
max_bytes = 16256

[[budget]]
command = "--grep=row_bytes"
max_bytes = 13312

# --pack-task is one bundle (ranking, bodies, callers, tests) under its own 6000-token budget, 18000 bytes.
[[budget]]
command = "--pack-task='add a verb'"
max_bytes = 18176

[[budget]]
command = "--hotspots"
max_bytes = 9344

[[budget]]
command = "--report"
max_bytes = 17024

[[budget]]
command = "--communities"
max_bytes = 10112

[[budget]]
command = "--deps"
max_bytes = 17536

[[budget]]
command = "--lint"
max_bytes = 13056

[[budget]]
command = "--clones"
max_bytes = 8704

[[budget]]
command = "--quality-panel"
max_bytes = 10240
