indexer = "lsp2scip"
indexer_version = "solidity-ls-0.9.3"
image = "ripwire-corpus-lsp:local"
index = "python3 /usr/local/lib/ripwire/lsp2scip.py --root /src --ext .sol --language-id solidity --out {out} --settle 20 -- nomicfoundation-solidity-language-server --stdio"
extensions = ["sol"]

[sql]
oracle = "none"
status = "none"
reason = "not applicable to --eval=scip: table and column references are not scored"
extensions = ["sql", "sqlx"]

[swift]
oracle = "lsp"
status = "blocked"
reason = "sourcekit-lsp 6.1 under linux/amd64 emulation exits before answering the first definition request on a SwiftPM package that builds cleanly (swift build succeeds in 17 s); a native arm64 image is the next thing to try. The first candidate, a macOS app, cannot compile on Linux (no SwiftUI)."
server = "sourcekit-lsp"
indexer = "lsp2scip"
indexer_version = "sourcekit-lsp-6.1"
image = "ripwire-corpus-swift:local"
setup = "swift build 2>&1 | tail -5"
index = "python3 /usr/local/lib/ripwire/lsp2scip.py --root /src --ext .swift --language-id swift --out {out} --settle 60 -- sourcekit-lsp"
extensions = ["swift"]

[toml]
oracle = "none"
status = "none"
reason = "not applicable: no reference captures"
