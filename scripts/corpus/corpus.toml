}
EOF
java -cp "$(cat /opt/scala-compiler-classpath.txt)" dotty.tools.dotc.Main -classpath "$(cat /opt/scala-library-classpath.txt)" -d /tmp/codegen/classes /src/project/codegen.scala /tmp/codegen/Generate.scala && java -cp "/tmp/codegen/classes:$(cat /opt/scala-library-classpath.txt)" Generate /tmp/work/core/shared/src/main/scala-generated/org/scalacheck'''
index = '''cd /tmp/work && find core/shared/src/main core/shared/src/test core/jvm/src/main core/jvm/src/test -name '*.scala' -not -path '*/scala-2.12-/*' | sort > /tmp/sources.txt && scala-semanticdb /tmp/classes /tmp/semanticdb $(cat /tmp/sources.txt) && scip-java index-semanticdb --output={out} /tmp/semanticdb'''
