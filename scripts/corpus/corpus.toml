indexer = "scip-php"
indexer_version = "0.0.2"
setup = "if [ -f composer.lock ]; then composer install --no-dev --no-interaction --no-progress --no-scripts --no-security-blocking; else composer dump-autoload --no-interaction && mkdir -p vendor/composer && php -r '$j = json_decode(file_get_contents(\"composer.json\"), true); $r = trim((string) shell_exec(\"git rev-parse HEAD\")); file_put_contents(\"vendor/composer/installed.php\", \"<?php return [\\\"root\\\" => [\\\"name\\\" => \\\"\" . ($j[\"name\"] ?? \"root/root\") . \"\\\", \\\"reference\\\" => \\\"$r\\\"], \\\"versions\\\" => []];\");'; fi"
index = "cd /src && scip-php && mv index.scip {out}"
precision_floor = 0.9815
recall_floor = 0.9774
