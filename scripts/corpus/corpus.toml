# Pinned corpus for scripts/corpus/corpus.py: public repositories with an official SCIP indexer.
#
# Each repo is pinned to a full commit SHA. Its indexer runs inside the image built from scripts/corpus/Dockerfile,
# with the checkout mounted at /src (a cache copy) and the output directory at /out.
#
# Fields:
#   languages            languages the repo is scored for
#   license              SPDX id; permissive only (MIT, Apache-2.0, BSD, zlib, CC0)
#   url, sha             a remote repo at a full 40-hex commit (cloned into the cache)
#   path                 instead of url/sha: a local tree, relative to the repo root (snapshotted, keyed by content)
#   subdir               url/sha only: index the whole repo (mounted at /src) and keep only the SCIP documents under this directory; default: all of it
#   indexer, indexer_version, index_file
#                        the indexer and the file it writes under /out; the runner moves it into the cache
#   setup                shell run first in /src (dependency install, build-system configure); may be empty
#   index                shell that writes {out} (= /out/<index_file>)
#   precision_floor, recall_floor
#                        lowest accepted --eval=scip values, set just under the measured value
#   image                docker image (default ripwire-corpus:local); tags per platform, e.g. ripwire-corpus-swift:arm64
#   platform             linux/amd64 (default) or linux/arm64: the docker --platform the indexer runs under; the image must
#                        be built for it, and the runner refuses one that is not
#   status               measured | unverified | blocked; blocked entries need a reason
#
# This file holds the inputs and the floors. The measured numbers live in baseline.toml, the ratchet written by
# make verify-ratchet (scripts/corpus/verify.py): it records each entry's precision and recall and raises the floors
# here to the measured value minus 0.002, and never lowers either. Edit a floor by hand only to lower it, with a reason.
# Repo URLs and SHAs live only in this file (see AGENTS.md).

# path = "." snapshots the working tree (tracked and unignored files), so its index and floors follow the
# content being measured, not a commit; re-measure after resolver changes. This repo is not pinned to a SHA.
[[repo]]
name = "ripwire-rs"
languages = ["rust"]
status = "measured"
license = "Apache-2.0"
path = "."
indexer = "rust-analyzer"
indexer_version = "1.98.1"
index = "rust-analyzer scip /src --output {out}"
precision_floor = 0.9838
recall_floor = 0.9754

