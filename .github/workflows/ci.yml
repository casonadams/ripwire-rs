name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Format, Lint & Complexity
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored grammars (pinned revisions)
        run: ./scripts/update-grammars.sh

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install cccc
        run: cargo binstall --no-confirm --locked --force cccc-cli@1.7.0

      - name: Format, clippy, complexity, registry and script gates
        run: make fmt-check clippy complexity registry script-tests

  tests:
    name: Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendored grammars (pinned revisions)
        run: ./scripts/update-grammars.sh

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149

      - name: Run tests
        env:
          NEXTEST_PROFILE: ci
          NEXTEST_SHOW_PROGRESS: none
        run: make test

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nextest-results
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
